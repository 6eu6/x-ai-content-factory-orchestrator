name: External Cron Dispatcher
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel cron dispatcher
        run: |
          curl -fsS "https://x-ai-content-factory-orchestrator.vercel.app/api/cron-dispatcher?secret=${{ secrets.ORCHESTRATOR_SECRET }}&source=github-actions"
